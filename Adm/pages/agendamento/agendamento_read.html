<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Agendamentos</title>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        
        <!-- CSS específicos necessários -->
        <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    </head>
    <style type="text/css">
        .modal-dialog {
            position: relative;
            display: table;
            overflow-y: auto;
            overflow-x: auto;
            width: auto;
            min-width: 300px;
        }
        .red {
            background-color: #fdd9cf !important;
            font-weight: bold;
            font-size: 14px;
        }
        .green {
            background-color: #cfffdf !important;
            font-weight: bold;
            font-size: 14px;
        }
        .black {
            background-color: #aeaeae !important;
            font-weight: bold;
            font-size: 14px;
        }
        @font-face {
            font-family: "TomaSans-Regular";
            src: local(Raleway), url(../../../fonte/TTF/TomaSans-Regular.ttf);
        }
        #tabela_agendamento{
            font-family: "calibri", Trebuchet MS, Arial, Helvetica, sans-serif;
        }
        
        /* Ocultar elementos específicos */
        #btnAtualizarManual,
        #autoUpdateDropdown,
        #auto-update-indicator {
            display: none !important;
        }
        
        /* Estilos básicos para agendamentos */
        .agendamento-pendente {
            background-color: #fff3cd !important;
        }
        
        .agendamento-confirmado {
            background-color: #d4edda !important;
        }
</style>
    <body>
        
        
        <!-- Content Wrapper. Contains page content -->
        <div class="container-fluid" style="padding: 0">
            <!-- Content Header (Page header) -->
            <section class="content-header">
                <h1 style="margin-top: -1px;margin-left: -6px;">
                Agendamentos<small>Visualização</small> 
                <small id="status-auto-update" style="color: #28a745; font-size: 12px; margin-left: 10px;">
                    <span class="glyphicon glyphicon-refresh"></span> Auto-atualização ativa
                </small>
                </h1>
            </section>
            <section class="content">
                <div class="row">
                    <div class="col-sx-12">
                        <div class="box">
                            <div class="box-header">
                                <form id="listagem" name="listagem" class="form-inline">
                                    <div class="container-fluid">
                                        <!-- Primeira linha: Filtros de Radio -->
                                        <div class="row" style="margin-bottom: 10px;">
                                            <div class="col-xs-12 col-sm-12 col-md-12">
                                                <div class="row radio-stack">
                                                    <div class="col-xs-4 col-sm-2 col-md-2" style="padding: 3px;">
                                                        <div class="custom-control custom-radio custom-control-inline radio-container">
                                                            <input type="radio" id="RadioPendentes" name="RadioSituacao" class="custom-control-input" value="1" checked>
                                                            <label class="custom-control-label" for="RadioPendentes">Pendentes</label>
                                                        </div>
                                                    </div>
                                                    <div class="col-xs-4 col-sm-2 col-md-2" style="padding: 3px;">
                                                        <div class="custom-control custom-radio custom-control-inline radio-container">
                                                            <input type="radio" id="RadioConfirmados" name="RadioSituacao" class="custom-control-input" value="2">
                                                            <label class="custom-control-label" for="RadioConfirmados">Confirmados</label>
                                                        </div>
                                                    </div>
                                                    <div class="col-xs-4 col-sm-2 col-md-2" style="padding: 3px;">
                                                        <div class="custom-control custom-radio custom-control-inline radio-container">
                                                            <input type="radio" id="RadioTodos" name="RadioSituacao" class="custom-control-input" value="0">
                                                            <label class="custom-control-label" for="RadioTodos">Todos</label>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <!-- Segunda linha: Outros filtros -->
                                        <div class="row" style="margin-bottom: 10px;">
                                            <div class="col-xs-6 col-sm-3 col-md-3" style="padding: 3px;">
                                                <label for="filtro_profissional">Profissional:</label>
                                                <input type="text" id="filtro_profissional" name="filtro_profissional" class="form-control input-sm" placeholder="Filtrar por profissional">
                                            </div>
                                            <div class="col-xs-6 col-sm-3 col-md-3" style="padding: 3px;">
                                                <label for="filtro_especialidade">Especialidade:</label>
                                                <input type="text" id="filtro_especialidade" name="filtro_especialidade" class="form-control input-sm" placeholder="Filtrar por especialidade">
                                            </div>
                                            <div class="col-xs-6 col-sm-3 col-md-3" style="padding: 3px;">
                                                <label for="filtro_convenio">Convênio:</label>
                                                <input type="text" id="filtro_convenio" name="filtro_convenio" class="form-control input-sm" placeholder="Filtrar por convênio">
                                            </div>
                                        </div>
                                        
                                        <!-- Terceira linha: Botões -->
                                        <div class="row" style="margin-bottom: 10px;">
                                            <div class="col-xs-12 col-sm-12 col-md-12" style="padding: 3px;">
                                                <button type="button" class="btn btn-primary btn-sm" id="btnFiltrar">
                                                    <span class="glyphicon glyphicon-filter"></span> Filtrar
                                                </button>
                                                <button type="button" class="btn btn-default btn-sm" id="btnLimparFiltros">
                                                    <span class="glyphicon glyphicon-remove"></span> Limpar Filtros
                                                </button>
                                                <button type="button" class="btn btn-success btn-sm" id="btnAtualizarTabela">
                                                    <span class="glyphicon glyphicon-refresh"></span> Atualizar
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div class="box-body">
                                <table id="tabela_agendamento" class="table table-striped table-bordered" style="width:100%">
                                    <thead>
                                        <tr role="row">
                                            <th>ID</th>
                                            <th>Cód. Associado</th>
                                            <th>Nome Associado</th>
                                            <th>ID Empregador</th>
                                            <th>Empregador</th>
                                            <th>Data Solicitação</th>
                                            <th>Data Agendada</th>
                                            <th>Cód. Convênio</th>
                                            <th>Status</th>
                                            <th>Profissional</th>
                                            <th>Especialidade</th>
                                            <th>Convênio</th>
                                            <th>Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        
        <!-- Modal para edição -->
        <div class="modal fade" id="ModalEditaAgendamento" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
            <div class="modal-dialog modal-lg" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                        <h4 class="modal-title" id="myModalLabel">Editar Agendamento</h4>
                    </div>
                    <div class="modal-body">
                        <form id="frmagendamento" method="post">
                            <input type="hidden" id="C_id_agendamento" name="C_id_agendamento" />
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="C_cod_associado_agendamento">Código Associado:</label>
                                        <input type="text" class="form-control" id="C_cod_associado_agendamento" name="C_cod_associado_agendamento" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="C_nome_associado_agendamento">Nome Associado:</label>
                                        <input type="text" class="form-control" id="C_nome_associado_agendamento" name="C_nome_associado_agendamento" readonly style="background-color: #f5f5f5;">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group" style="display: none;">
                                        <label for="C_id_empregador_agendamento">ID Empregador:</label>
                                        <input type="number" class="form-control" id="C_id_empregador_agendamento" name="C_id_empregador_agendamento">
                                    </div>
                                    <div class="form-group">
                                        <label for="C_nome_empregador_agendamento">Nome Empregador:</label>
                                        <input type="text" class="form-control" id="C_nome_empregador_agendamento" name="C_nome_empregador_agendamento" readonly style="background-color: #f5f5f5;">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="C_data_solicitacao_agendamento">Data Solicitação:</label>
                                        <input type="datetime-local" class="form-control" id="C_data_solicitacao_agendamento" name="C_data_solicitacao_agendamento">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="C_data_agendada_agendamento">Data Agendada:</label>
                                        <input type="datetime-local" class="form-control" id="C_data_agendada_agendamento" name="C_data_agendada_agendamento">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6" style="display: none;">
                                    <div class="form-group">
                                        <label for="C_cod_convenio_agendamento">Código Convênio:</label>
                                        <input type="text" class="form-control" id="C_cod_convenio_agendamento" name="C_cod_convenio_agendamento">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="C_status_agendamento">Status:</label>
                                        <select class="form-control" id="C_status_agendamento" name="C_status_agendamento">
                                            <option value="1">Pendente</option>
                                            <option value="2">Confirmado</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="C_profissional_agendamento">Profissional:</label>
                                        <input type="text" class="form-control" id="C_profissional_agendamento" name="C_profissional_agendamento">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="C_especialidade_agendamento">Especialidade:</label>
                                        <input type="text" class="form-control" id="C_especialidade_agendamento" name="C_especialidade_agendamento">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="C_convenio_nome_agendamento">Nome Convênio:</label>
                                        <input type="text" class="form-control" id="C_convenio_nome_agendamento" name="C_convenio_nome_agendamento">
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" id="btnSalvar">Salvar Alterações</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Scripts necessários para DataTables -->
        <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="../Adm/pages/agendamento/js/agendamento_read_script.js"></script>
    </body>
</html>
