<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Associados Pendentes</title>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    </head>
    <style type="text/css">
        .modal-dialog {
            position: relative;
            display: table;
            overflow-y: auto;
            overflow-x: auto;
            width: auto;
            min-width: 300px;
        }
        .red {
            background-color: #fdd9cf !important;
            font-weight: bold;
            font-size: 14px;
        }
        .green {
            background-color: #cfffdf !important;
            font-weight: bold;
            font-size: 14px;
        }
        .black {
            background-color: #aeaeae !important;
            font-weight: bold;
            font-size: 14px;
        }
        @font-face {
            font-family: "TomaSans-Regular";
            src: local(Raleway), url(../../../fonte/TTF/TomaSans-Regular.ttf);
        }
        #tabela_associados_pendentes{
            font-family: "calibri", Trebuchet MS, Arial, Helvetica, sans-serif;
        }
    </style>
    <body>
        <!-- Content Wrapper. Contains page content -->
        <div class="container-fluid" style="padding: 0">
            <!-- Content Header (Page header) -->
            <section class="content-header">
                <h1 style="margin-top: -1px;margin-left: -6px;">
                Associados Pendentes <small>Visualização</small> </h1>
            </section>
            <section class="content">
                <div class="row">
                    <div class="col-sx-12">
                        <div class="box">
                            <div class="box-header">
                                <form id="listagem" name="listagem" class="form-inline">
                                    <div class="container">
                                        <div class="row justify-content-md-center">
                                            <div class="col-sm-6" style="padding-top: 6px;">
                                                <h4>Cadastros pendentes de aprovação</h4>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div class="box-body">
                                <table id="tabela_associados_pendentes" class="table display table-striped table-hover compact" style="width:100%">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>NOME</th>
                                            <th>ENDEREÇO</th>
                                            <th>BAIRRO</th>
                                            <th>DATA NASC.</th>
                                            <th>CPF</th>
                                            <th>EMAIL</th>
                                            <th>CELULAR</th>
                                            <th>CÓDIGO</th>
                                            <th>EMPREGADOR</th>
                                            <th>ALTERAR</th>
                                            <th>APROVAR</th>
                                        </tr>
                                    </thead>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <!-- Modal Edita -->
        <div class="modal fade" id="ModalEdita" name="ModalEdita" tabindex="-1" role="dialog" aria-labelledby="ModalEditaLabel" aria-hidden="true">
            <form data-toggle="validator" role="form" name="frmassociado" id="frmassociado">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="ModalEditaLabel" style="width: 300px;float: left;font-size: x-large;">CADASTRO PENDENTE&nbsp<small id="rotulo_associado">Alterando</small></h5>
                        <button type="button" class="btn btn-secondary" data-dismiss="modal" style="float: right;">Fechar</button>
                        <div class="form-group control-group" style="float: right;padding-right: 5px;">
                            <button type="button" class="btn btn-success" id="btnTransferir" style="margin-right: 5px;">
                                <span class="glyphicon glyphicon-transfer"></span>
                                Transferir para cadastro definitivo
                            </button>
                            <button type="button" class="btn btn-primary" id="btnSalvar">
                                <span class="glyphicon glyphicon-send"></span>
                                Salvar
                            </button>
                        </div>
                    </div>
                    <div class="modal-body">
                        <div class="container-fluid">
                            <div class="row">
                                <div class="col-md-12 col-lg-12 col-xs-12 col-sm-12">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_nome">Nome</label>
                                        <input type="text" class="form-control input-sm" id="C_nome" name="C_nome" style="text-transform:uppercase" maxlength="50" placeholder="Nome" required>
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                        <input type="hidden" name="C_id" id="C_id">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xs-8 col-sm-8 col-md-8 col-lg-8" style="padding-right: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_endereco">Endereço</label>
                                        <input type="text" class="form-control input-sm" id="C_endereco" name="C_endereco" style="text-transform:uppercase" placeholder="Endereço" data-error="Por favor, informe o endereço." maxlength="50" required>
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                    </div>
                                </div>
                                <div class="col-md-4 col-sm-4 col-lg-4 col-xs-4" style="padding-left: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_numero">Número</label>
                                        <input type="text" class="form-control input-sm" id="C_numero" name="C_numero" maxlength="10" placeholder="Número" required>
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-right: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_complemento">Complemento</label>
                                        <input type="text" class="form-control input-sm" id="C_complemento" name="C_complemento" style="text-transform:uppercase" placeholder="Complemento" maxlength="20">
                                    </div>
                                </div>
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-left: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_bairro">Bairro</label>
                                        <input type="text" class="form-control input-sm" id="C_bairro" name="C_bairro" style="text-transform:uppercase" placeholder="Bairro" maxlength="30" required>
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-right: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_cidade">Cidade</label>
                                        <input type="text" class="form-control input-sm" id="C_cidade" name="C_cidade" style="text-transform:uppercase" placeholder="Cidade" maxlength="30" required>
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                    </div>
                                </div>
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-left: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_uf">UF</label>
                                        <select class="form-control input-sm" id="C_uf" name="C_uf" required>
                                            <option value="AC">Acre</option>
                                            <option value="AL">Alagoas</option>
                                            <option value="AP">Amapá</option>
                                            <option value="AM">Amazonas</option>
                                            <option value="BA">Bahia</option>
                                            <option value="CE">Ceará</option>
                                            <option value="DF">Distrito Federal</option>
                                            <option value="ES">Espírito Santo</option>
                                            <option value="GO">Goiás</option>
                                            <option value="MA">Maranhão</option>
                                            <option value="MT">Mato Grosso</option>
                                            <option value="MS">Mato Grosso do Sul</option>
                                            <option value="MG">Minas Gerais</option>
                                            <option value="PA">Pará</option>
                                            <option value="PB">Paraíba</option>
                                            <option value="PR">Paraná</option>
                                            <option value="PE">Pernambuco</option>
                                            <option value="PI">Piauí</option>
                                            <option value="RJ">Rio de Janeiro</option>
                                            <option value="RN">Rio Grande do Norte</option>
                                            <option value="RS">Rio Grande do Sul</option>
                                            <option value="RO">Rondônia</option>
                                            <option value="RR">Roraima</option>
                                            <option value="SC">Santa Catarina</option>
                                            <option value="SP">São Paulo</option>
                                            <option value="SE">Sergipe</option>
                                            <option value="TO">Tocantins</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-right: 2px;">
                                    <div class="form-group control-group">
                                        <label class="control-label" for="C_cep">CEP</label>
                                        <input type="text" class="form-control input-sm" id="C_cep" name="C_cep" placeholder="CEP" maxlength="10">
                                    </div>
                                </div>
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-left: 2px;">
                                    <div class="form-group control-group">
                                        <label class="control-label" for="C_nascimento">Data de Nascimento</label>
                                        <input type="text" class="form-control input-sm" id="C_nascimento" name="C_nascimento" placeholder="00/00/0000" maxlength="10">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-right: 2px;">
                                    <div class="form-group control-group">
                                        <label class="control-label" for="C_cpf">CPF</label>
                                        <input type="text" class="form-control input-sm" id="C_cpf" name="C_cpf" placeholder="CPF" maxlength="14">
                                    </div>
                                </div>
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-left: 2px;">
                                    <div class="form-group control-group">
                                        <label class="control-label" for="C_rg">RG</label>
                                        <input type="text" class="form-control input-sm" id="C_rg" name="C_rg" placeholder="RG" maxlength="20">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-right: 2px;">
                                    <div class="form-group control-group">
                                        <label class="control-label" for="C_telres">Telefone Residencial</label>
                                        <input type="text" class="form-control input-sm" id="C_telres" name="C_telres" placeholder="(00)0000-0000" maxlength="13">
                                    </div>
                                </div>
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-left: 2px;">
                                    <div class="form-group control-group">
                                        <label class="control-label" for="C_telcom">Telefone Comercial</label>
                                        <input type="text" class="form-control input-sm" id="C_telcom" name="C_telcom" placeholder="(00)0000-0000" maxlength="13">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-right: 2px;">
                                    <div class="form-group control-group">
                                        <label class="control-label" for="C_cel">Celular</label>
                                        <input type="text" class="form-control input-sm" id="C_cel" name="C_cel" placeholder="(00)00000-0000" maxlength="15">
                                    </div>
                                </div>
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-left: 2px;">
                                    <div class="form-group control-group">
                                        <label class="control-label" for="C_email">Email</label>
                                        <input type="email" class="form-control input-sm" id="C_email" name="C_email" placeholder="email@dominio.com" maxlength="50">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-right: 2px;">
                                    <div class="form-group control-group">
                                        <label class="control-label" for="C_codigo">Código ou matricula</label>
                                        <input type="text" class="form-control input-sm" id="C_codigo" name="C_codigo" placeholder="Código" maxlength="20">
                                    </div>
                                </div>
                                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6" style="padding-left: 2px;">
                                    <div class="form-group control-group">
                                        <label class="control-label" for="C_empregador">Empregador</label>
                                        <select class="form-control input-sm" id="C_empregador" name="C_empregador">
                                            <option value="">Selecione o empregador</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </form>
        </div>
        <!-- Include do arquivo JavaScript específico da página -->
        <script src="pages/associados_pendentes/js/associados_pendentes_script.js"></script>
    </body>
</html>
