<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <style type="text/css">
        tfoot input {
            width: 100%;
            padding: 3px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <section class="content-header">
        <h1 style="margin-top: -1px;margin-left: -6px;">
            Arquivos <small>desconto em folha</small> </h1>
    </section>
    <section class="content">
        <div class="row">
            <div class="col-sx-12">
                <div class="box">
                    <div class="box-header">
                        <form id="listagem" name="listagem" role="form">
                            <!-- Primeira linha: Campos de seleção -->
                            <div class="form-group row">
                                <div class="col-md-3" style="width: 150px">
                                    <label for="C_mes">Mês</label>
                                    <select class="form-control i_bd" id="C_mes" name="C_mes">
                                    </select>
                                    <input type="hidden" name="C_mes_hidden" id="C_mes_hidden" value=""/>
                                </div>
                                <div class="col-md-4">
                                    <label for="C_empregador">Empregador</label>
                                    <select class="form-control i_bd" id="C_empregador" name="C_empregador">
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="C_tipo">Tipo</label>
                                    <select class="form-control i_bd" id="C_tipo" name="C_tipoconvenio">
                                    </select>
                                </div>
                            </div>
                            
                            <!-- Segunda linha: Botões de ação -->
                            <div class="form-group row" style="margin-top: 15px;">
                                <div class="col-md-3">
                                    <input type="button" name="gerararquivo" id="gerararquivo" class="btn btn-primary btn-block" value="Gerar Arquivo" />
                                </div>
                                <div class="col-md-3">
                                    <input type="button" name="relatoriofinal" id="relatoriofinal" class="btn btn-primary btn-block" value="Relatório Individual" title="Gerar relatório para o empregador selecionado" />
                                </div>
                                <div class="col-md-3">
                                    <input type="button" name="relatorio_todos" id="relatorio_todos" class="btn btn-success btn-block" value="Todos em 1 PDF" title="Gerar relatório com todos os empregadores em páginas separadas" />
                                </div>
                                <div class="col-md-3">
                                    <input type="button" name="relatorio_individuais" id="relatorio_individuais" class="btn btn-info btn-block" value="PDFs Separados" title="Gerar um PDF individual para cada empregador" />
                                </div>
                            </div>
                            
                        </form>
                    </div>
                    <div class="box-body">
                        <table id="tabela_dados" class="display table table-striped table-hover dt-responsive compact nowrap" width="100%">
                            <thead>
                                <tr>
                                    <th>MATRICULA</th>
                                    <th>NOME</th>
                                    <th>TIPO</th>
                                    <th>TOTAL</th>
                                </tr>
                            </thead>
                            <tfoot>
                                <tr>
                                    <th></th>
                                    <th></th>
                                    <th></th>
                                    <th></th>
                                </tr>
                            <tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="../Adm/pages/arquivos/js/FileSaver.js"></script>
    <script src="../Adm/pages/arquivos/js/arquivos_read_script.js"></script>
</body>
</html>
