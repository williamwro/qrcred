<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Profissionais</title>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
        <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    </head>
    <style type="text/css">

        body {
            /* table-layout: fixed; removido para não interferir com DataTables */
        }
        
        /* Estilos específicos para a tabela de profissionais - máxima especificidade */
        html body #tabela_profissionais.display.table.table-striped.table-hover.dt-responsive.compact.nowrap {
            table-layout: fixed !important;
            width: 100% !important;
            max-width: none !important;
        }
        
        html body #tabela_profissionais.display.table.table-striped.table-hover.dt-responsive.compact.nowrap th,
        html body #tabela_profissionais.display.table.table-striped.table-hover.dt-responsive.compact.nowrap td {
            white-space: normal !important;
            word-wrap: break-word !important;
        }
        
        html body #tabela_profissionais.display.table.table-striped.table-hover.dt-responsive.compact.nowrap th:nth-child(2),
        html body #tabela_profissionais.display.table.table-striped.table-hover.dt-responsive.compact.nowrap td:nth-child(2) {
            width: 60% !important;
            min-width: 60% !important;
            max-width: 60% !important;
        }
        
        html body #tabela_profissionais.display.table.table-striped.table-hover.dt-responsive.compact.nowrap th:nth-child(3),
        html body #tabela_profissionais.display.table.table-striped.table-hover.dt-responsive.compact.nowrap td:nth-child(3),
        html body #tabela_profissionais.display.table.table-striped.table-hover.dt-responsive.compact.nowrap th:nth-child(4),
        html body #tabela_profissionais.display.table.table-striped.table-hover.dt-responsive.compact.nowrap td:nth-child(4) {
            width: 20% !important;
            min-width: 20% !important;
            max-width: 20% !important;
            text-align: center !important;
        }
        
        /* CSS adicional para remover qualquer interferência externa */
        #custom-table-style {
            display: none !important;
        }
        
        th {
        font-size: 12px;
        white-space: nowrap;
        }
        td {
        font-size: 11px;
        }
        tfoot input {
        width: 100%;
        padding: 3px;
        box-sizing: border-box;
        }
        
        /* Estilos para tags de especialidades */
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .tag-item {
            background-color: #007bff;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .tag-remove {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            margin-left: 5px;
        }
        
        .tag-remove:hover {
            color: #ffcccc;
        }
        
        #C_filtro_especialidade {
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        #C_filtro_especialidade:focus {
            border-color: #66afe9;
            box-shadow: 0 0 5px rgba(102, 175, 233, 0.6);
        }
        
        /* Estilos para drag and drop */
        #C_especialidade_select option {
            cursor: grab;
            padding: 5px;
        }
        
        #C_especialidade_select option:hover {
            background-color: #f0f0f0;
        }
        
        #C_especialidade_select option:active {
            cursor: grabbing;
        }
        
        .drag-preview {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        #lista_especialidades.drag-over {
            border-color: #337ab7 !important;
            background-color: #f0f8ff;
            box-shadow: 0 0 10px rgba(51, 122, 183, 0.3);
            transition: all 0.3s ease;
        }
        
        #lista_especialidades {
            transition: all 0.3s ease;
            position: relative;
        }
        
        #lista_especialidades::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 2px dashed transparent;
            border-radius: 6px;
            pointer-events: none;
        }
        
        #lista_especialidades.drag-over::before {
            border-color: #337ab7;
        }
        
        /* Estilos adicionais para drag and drop */
        body.dragging {
            cursor: grabbing !important;
            user-select: none;
        }
        
        body.dragging * {
            cursor: grabbing !important;
        }
        
        #lista_especialidades.drop-hint {
            border-color: #bce8f1;
            background-color: #f9f9f9;
        }
        
        #lista_especialidades.drop-success {
            border-color: #5cb85c !important;
            background-color: #e8f5e8 !important;
            box-shadow: 0 0 15px rgba(92, 184, 92, 0.5);
            animation: dropSuccess 0.6s ease;
        }
        
        @keyframes dropSuccess {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        
        /* Melhorar aparência do select para drag */
        #C_especialidade_select {
            user-select: none;
        }
        
        /* Texto de instrução na lista vazia */
        #lista_especialidades:empty::after {
            content: '📋 Arraste especialidades aqui ou use o botão "Adicionar"';
            color: #999;
            font-style: italic;
            font-size: 11px;
            display: block;
            text-align: center;
            padding: 15px;
        }
        
        /* Ícone de drop zone */
        #lista_especialidades:empty::before {
            content: '⬇️';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            opacity: 0.3;
            z-index: 1;
        }
</style>
    <body>
        <!-- Content Wrapper. Contains page content -->
        <div class="container-fluid" style="padding: 0">
            <!-- Content Header (Page header) -->
            <section class="content-header">
                <h1 style="margin-top: -1px;margin-left: -6px;">
                    Profissionais <small>Visualização</small> </h1>
                <ol class="breadcrumb">
                    <li>
                        <a href="#"><i class="fa fa-dashboard"></i> Home</a>
                    </li>
                    <li>
                        <a href="#">Tables</a>
                    </li>
                    <li class="active">Data tables</li>
                </ol>
            </section>
            <section class="content">
                <div id="alert_mensagem" style="display:none;"></div>
                <div class="row">
                    <div class="col-sx-12">
                        <div class="box">
                            <div class="box-header">
                                <form id="listagem" name="listagem" class="form-inline">
                                    <input type="button" name="btnInserir" id="btnInserir" class="btn btn-primary" value="Inserir" />
                                </form>
                            </div>
                            <div class="box-body">
                                <table id="tabela_profissionais" class="display table table-striped table-hover dt-responsive compact nowrap" style="width:100%">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Nome Profissional</th>
                                            <th></th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <!-- Modal Edita e Cadastra -->
        <div class="modal fade" id="ModalEditaProfissional" name="ModalEditaProfissional" tabindex="-1" role="dialog" aria-labelledby="ModalEditaLabel" aria-hidden="true">
            <form data-toggle="validator" role="form" name="frmprofissional" id="frmprofissional">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="ModalEditaLabel" style="width: 150px;float: left;font-size: x-large;">PROFISSIONAL&nbsp<small id="rotulo_associado">Alterando</small></h5>
                        <button type="button" class="btn btn-secondary" data-dismiss="modal" style="float: right;">Fechar</button>
                        <div class="form-group control-group" style="float: right;padding-right: 5px;">
                            <button type="submit" class="btn btn-primary" id="btnSalvar">
                                <span class="glyphicon glyphicon-send"></span>
                                Salvar
                            </button>
                        </div>
                    </div>
                    <div class="modal-body">
                        <div class="container-fluid">
                            <div class="row">
                                <div class="col-md-2 col-sm-2 col-lg-2 col-xs-2" style="padding-left: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_id_profissional">ID</label>
                                        <input type="text" class="form-control input-sm" id="C_id_profissional" name="C_id_profissional" disabled>
                                        <input type="hidden" class="form-control input-sm" id="C_idx" name="C_idx">
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                    </div>
                                </div>
                                <div class="col-md-6 col-lg-6 col-xs-6 col-sm-6" style="padding-right: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_nome_profissional">Nome Profissional</label>
                                        <input type="text" class="form-control input-sm" id="C_nome_profissional" name="C_nome_profissional" style="text-transform:uppercase" maxlength="100" placeholder="Nome Profissional" required>
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                        <input type="hidden" name="operation" id="operation">
                                    </div>
                                </div>

                            </div>
                            <div class="row">
                                <div class="col-md-6 col-lg-6 col-xs-6 col-sm-6" style="padding-left: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_contato_nome1">Contato Nome 1</label>
                                        <input type="text" class="form-control input-sm" id="C_contato_nome1" name="C_contato_nome1" style="text-transform:uppercase" maxlength="100" placeholder="Nome do Contato 1">
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                    </div>
                                </div>
                                <div class="col-md-6 col-lg-6 col-xs-6 col-sm-6" style="padding-right: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_cel_telefone1">Celular</label>
                                        <input type="text" class="form-control input-sm" id="C_cel_telefone1" name="C_cel_telefone1" maxlength="15" placeholder="(__) _____-____">
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 col-lg-6 col-xs-6 col-sm-6" style="padding-left: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_contato_nome2">Contato Nome 2</label>
                                        <input type="text" class="form-control input-sm" id="C_contato_nome2" name="C_contato_nome2" style="text-transform:uppercase" maxlength="100" placeholder="Nome do Contato 2">
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                    </div>
                                </div>
                                <div class="col-md-6 col-lg-6 col-xs-6 col-sm-6" style="padding-right: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_cel_telefone2">Telefone Fixo</label>
                                        <input type="text" class="form-control input-sm" id="C_cel_telefone2" name="C_cel_telefone2" maxlength="14" placeholder="(__) ____-____">
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="form-group">
                                        
                                        <div class="row">
                                            <div class="col-md-6 col-lg-6 col-xs-6 col-sm-6" style="padding-left: 2px;">
                                                <label class="control-label" for="C_filtro_especialidade">Filtrar Especialidades</label>
                                                <input type="text" class="form-control input-sm" id="C_filtro_especialidade" placeholder="Digite para filtrar especialidades..." style="margin-bottom: 5px;">
                                                <select class="form-control input-sm" id="C_especialidade_select" size="6" style="height: auto;" title="💡 Dica: Você pode arrastar as especialidades diretamente para a lista abaixo!">
                                                    <option value="">Selecione uma especialidade...</option>
                                                </select>
                                            </div>
                                            <div class="col-md-6 col-lg-6 col-xs-6 col-sm-6" style="padding-right: 2px;padding-top: 25px;">
                                                <button type="button" class="btn btn-success btn-sm" id="btn_adicionar_especialidade">
                                                    <i class="fa fa-plus"></i> Adicionar
                                                </button>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="tag-container" id="lista_especialidades" style="margin-top: 10px; min-height: 50px; border: 1px solid #ddd; padding: 10px; border-radius: 4px;">
                                                <!-- Tags das especialidades aparecerão aqui -->
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        </div>
        <script src="../Adm/pages/profissionais/js/profissionais.js"></script>
        <script>
            // Função para aplicar máscara de celular (11 dígitos)
            function aplicarMascaraCelular(selector) {
                $(selector).on('input', function() {
                    var value = this.value.replace(/\D/g, '');
                    if (value.length <= 11) {
                        if (value.length <= 2) {
                            value = value.replace(/(\d{1,2})/, '($1');
                        } else if (value.length <= 7) {
                            value = value.replace(/(\d{2})(\d{1,5})/, '($1) $2');
                        } else {
                            value = value.replace(/(\d{2})(\d{5})(\d{1,4})/, '($1) $2-$3');
                        }
                    }
                    this.value = value;
                });
            }
            
            // Função para aplicar máscara de telefone fixo (10 dígitos)
            function aplicarMascaraTelefoneFixo(selector) {
                $(selector).on('input', function() {
                    var value = this.value.replace(/\D/g, '');
                    if (value.length <= 10) {
                        if (value.length <= 2) {
                            value = value.replace(/(\d{1,2})/, '($1');
                        } else if (value.length <= 6) {
                            value = value.replace(/(\d{2})(\d{1,4})/, '($1) $2');
                        } else {
                            value = value.replace(/(\d{2})(\d{4})(\d{1,4})/, '($1) $2-$3');
                        }
                    }
                    this.value = value;
                });
            }
            
            // Aplicar máscaras específicas
            aplicarMascaraCelular('#C_cel_telefone1');
            aplicarMascaraTelefoneFixo('#C_cel_telefone2');
        </script>
   </body>
</html>
