<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Associados</title>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
        <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
        <!-- DataTables Buttons -->
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/buttons/2.0.1/css/buttons.dataTables.min.css">
        <script type="text/javascript" src="https://cdn.datatables.net/buttons/2.0.1/js/dataTables.buttons.min.js"></script>
        <script type="text/javascript" src="https://cdn.datatables.net/buttons/2.0.1/js/buttons.html5.min.js"></script>
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <style type="text/css">
        th, td { white-space: nowrap; }
        div.dataTables_wrapper {
            margin: 0 auto;
        }

        div.container {
            width: 80%;
        }
        th {
            font-size: 12px;
            white-space: nowrap;
        }
        td {
            font-size: 11px;
        }
        .modal-dialog {
            position: relative;
            display: table;
            overflow-y: auto;
            overflow-x: auto;
            width: auto;
            min-width: 400px;
        }
        .form-group {
            margin-bottom: 2px;
        }
        thead input {
            width: 100%;
        }
    </style>
</head>
<body>
<section class="content-header">
    <h1 style="margin-top: -1px;margin-left: -6px;">
        Produção <small>Visualização</small> </h1>
</section>
<section class="content">
    <div class="row">
        <div class="col-sx-12">
            <div class="box">
                <div class="box-header">
                    <form id="listagem" name="listagem"role="form">

                        <div class="form-group row">
                            <div class="col-md-8">
                                <label for="C_nome_convenio">Convenio</label>
                                <input type="text" class="form-control" disabled id="C_nome_convenio">
                                <input type="hidden" id="cod_convenio" name="cod_convenio" value="">
                            </div>
                            <div class="col-md-2" style="padding-top: 24px;">
                                <button type="button" id="btnLimparConvenio" class="btn btn-warning btn-block" title="Limpar seleção do convênio">
                                    <i class="fa fa-eraser"></i> Limpar Convênio
                                </button>
                            </div>
                            <div class="col-md-2" style="padding-top: 24px;">
                                <input type="button" name="btnBuscaConvenio" id="btnBuscaConvenio" class="btn btn-primary" value="Consultar" />
                            </div>

                        </div>
                        <div class="form-group row">
                            <div class="col-md-3">
                                <label for="C_mes">Mês</label>
                                <select class="form-control i_bd" id="C_mes" name="C_mes">
                                </select>
                                <input type="hidden" name="C_mes_hidden" id="C_mes_hidden" value=""/>
                            </div>
                            <div class="col-md-3">
                                <label for="C_parcela">Parcela</label>
                                <select class="form-control i_bd" id="C_parcela" name="C_parcela">
                                </select>
                            </div>
                            <div class="col-md-3" style="padding-top: 24px;">
                                <input type="button" name="btnExibir" id="btnExibir" class="btn btn-primary btn-block" value="Exibir Dados" />
                            </div>
                        </div>
                        
                        <div class="form-group row" style="margin-top: 10px;">
                            <div class="col-md-3">
                                <div class="btn-group btn-block">
                                    <button type="button" class="btn btn-primary dropdown-toggle btn-block" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                        Relatório Individual <span class="caret"></span>
                                    </button>
                                    <ul class="dropdown-menu" style="width: 100%;">
                                        <li style="background-color: #e3f2fd;">
                                            <a href="#" id="relatorio_producao_somente" style="color: #1976d2; font-weight: 500; padding: 10px 15px; display: block;">
                                                <i class="fa fa-file-text-o"></i> Somente Relatório
                                            </a>
                                        </li>
                                        <li style="background-color: #fff3e0;">
                                            <a href="#" id="relatorio_producao_oficio" style="color: #f57c00; font-weight: 500; padding: 10px 15px; display: block;">
                                                <i class="fa fa-file-pdf-o"></i> Ofício
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="btn-group btn-block">
                                    <button type="button" class="btn btn-success dropdown-toggle btn-block" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                        Todos em 1 PDF <span class="caret"></span>
                                    </button>
                                    <ul class="dropdown-menu" style="width: 100%;">
                                        <li style="background-color: #e8f5e9;">
                                            <a href="#" id="relatorio_producao_todos" style="color: #2e7d32; font-weight: 500; padding: 10px 15px; display: block;">
                                                <i class="fa fa-file-text-o"></i> Somente Relatório
                                            </a>
                                        </li>
                                        <li style="background-color: #fff3e0;">
                                            <a href="#" id="relatorio_producao_todos_oficio" style="color: #f57c00; font-weight: 500; padding: 10px 15px; display: block;">
                                                <i class="fa fa-file-pdf-o"></i> Ofício
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="btn-group btn-block">
                                    <button type="button" class="btn btn-info dropdown-toggle btn-block" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                        PDFs Separados <span class="caret"></span>
                                    </button>
                                    <ul class="dropdown-menu" style="width: 100%;">
                                        <li style="background-color: #e1f5fe;">
                                            <a href="#" id="relatorio_producao_individuais" style="color: #0277bd; font-weight: 500; padding: 10px 15px; display: block;">
                                                <i class="fa fa-file-text-o"></i> Somente Relatório
                                            </a>
                                        </li>
                                        <li style="background-color: #fff3e0;">
                                            <a href="#" id="relatorio_producao_individuais_oficio" style="color: #f57c00; font-weight: 500; padding: 10px 15px; display: block;">
                                                <i class="fa fa-file-pdf-o"></i> Ofício
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <button type="button" id="exportarExcel" class="btn btn-warning btn-block">
                                    <i class="fa fa-file-excel-o"></i> Exportar Excel
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="box-body">
                    <table id="tabela_producao" class="display table table-striped table-hover dt-responsive compact nowrap" width="100%">
                        <thead>
                            <tr>
                                <th></th>
                                <th>LANÇAMENTO</th>
                                <th>MATRICULA</th>
                                <th>VALOR</th>
                                <th>DATA</th>
                                <th>HORA</th>
                                <th>ASSOCIADO</th>
                                <th>CONVENIO</th>
                                <th>EMPREGADOR</th>
                                <th>PARCELA</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Modal Busca Convenio -->
<section class="content">
    <div class="row">
        <div class="modal fade" id="ModalBuscaConvenio" name="ModalBuscaAssociado">
            <form data-toggle="validator" role="form" name="frmbusca" id="frmbuscaConvenio">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" style="width: 100px;float: left;font-size: x-large;">CONVENIO&nbsp<small>Consultando&nbsp-&nbsp<span id="mes_rotulo"></span></small></h5>
                            <button type="button" class="btn btn-secondary" data-dismiss="modal" style="float: right;">Fechar</button>
                        </div>
                        <div class="modal-body">
                            <div class="container-fluid">
                                <div class="row">
                                    <div class="col-sx-12">
                                        <table id="tabela_busca_convenio" class="display table table-striped table-hover dt-responsive compact" width="100%">
                                            <thead>
                                            <tr>
                                                <th>CODIGO</th>
                                                <th>RAZAO SOCIAL</th>
                                                <th>NOME FANTASIA</th>
                                                <th>ENDEREÇO</th>
                                                <th>TELEFONE</th>
                                                <th>TOTAL</th>
                                            </tr>
                                            </thead>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
<script src="../Adm/pages/producao/js/producao_read_script.js"></script>
</body>
</html>
