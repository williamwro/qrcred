<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Especialidades</title>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
        <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    </head>
    <style type="text/css">

        body {
            table-layout: fixed;
        }
        th {
        font-size: 12px;
        white-space: nowrap;
        }
        td {
        font-size: 11px;
        }
        tfoot input {
        width: 100%;
        padding: 3px;
        box-sizing: border-box;
        }
</style>
    <body>
        <!-- Content Wrapper. Contains page content -->
        <div class="container-fluid" style="padding: 0">
            <!-- Content Header (Page header) -->
            <section class="content-header">
                <h1 style="margin-top: -1px;margin-left: -6px;">
                    Especialidades <small>Visualização</small> </h1>
                <ol class="breadcrumb">
                    <li>
                        <a href="#"><i class="fa fa-dashboard"></i> Home</a>
                    </li>
                    <li>
                        <a href="#">Tables</a>
                    </li>
                    <li class="active">Data tables</li>
                </ol>
            </section>
            <section class="content">
                <div id="alert_mensagem" style="display:none;"></div>
                <div class="row">
                    <div class="col-sx-12">
                        <div class="box">
                            <div class="box-header">
                                <form id="listagem" name="listagem" class="form-inline">
                                    <input type="button" name="btnInserir" id="btnInserir" class="btn btn-primary" value="Inserir" />
                                </form>
                            </div>
                            <div class="box-body">
                                <table id="tabela_especialidades" class="display table table-striped table-hover dt-responsive compact nowrap" style="width:100%">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Nome Especialidade</th>
                                            <th>Tipo</th>
                                            <th></th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <!-- Modal Edita e Cadastra -->
        <div class="modal fade" id="ModalEditaEspecialidade" name="ModalEditaEspecialidade" tabindex="-1" role="dialog" aria-labelledby="ModalEditaLabel" aria-hidden="true">
            <form data-toggle="validator" role="form" name="frmespecialidade" id="frmespecialidade">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="ModalEditaLabel" style="width: 150px;float: left;font-size: x-large;">ESPECIALIDADE&nbsp<small id="rotulo_associado">Alterando</small></h5>
                        <button type="button" class="btn btn-secondary" data-dismiss="modal" style="float: right;">Fechar</button>
                        <div class="form-group control-group" style="float: right;padding-right: 5px;">
                            <button type="submit" class="btn btn-primary" id="btnSalvar">
                                <span class="glyphicon glyphicon-send"></span>
                                Salvar
                            </button>
                        </div>
                    </div>
                    <div class="modal-body">
                        <div class="container-fluid">
                            <div class="row">
                                <div class="col-md-2 col-sm-2 col-lg-2 col-xs-2" style="padding-left: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_id">ID</label>
                                        <input type="text" class="form-control input-sm" id="C_id" name="C_id" disabled>
                                        <input type="hidden" class="form-control input-sm" id="C_idx" name="C_idx">
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                    </div>
                                </div>
                                <div class="col-md-6 col-lg-6 col-xs-6 col-sm-6" style="padding-right: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_nome_especialidade">Nome Especialidade</label>
                                        <input type="text" class="form-control input-sm" id="C_nome_especialidade" name="C_nome_especialidade" style="text-transform:uppercase" maxlength="50" placeholder="Nome Especialidade" required>
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                        <input type="hidden" name="operation" id="operation">
                                    </div>
                                </div>
                                <div class="col-md-4 col-lg-4 col-xs-4 col-sm-4" style="padding-right: 2px;">
                                    <div class="form-group control-group has-feedback">
                                        <label class="control-label" for="C_tipo">Tipo</label>
                                        <select class="form-control input-sm" id="C_tipo" name="C_tipo" required>
                                            <option value="">Selecione um tipo</option>
                                        </select>
                                        <span class="glyphicon form-control-feedback" aria-hidden="true"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        </div>
        <script src="../Adm/pages/especialidades/js/especialidades.js"></script>
   </body>
</html>
