<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <style type="text/css">
        th, td { white-space: nowrap; }
        div.dataTables_wrapper {
            margin: 0 auto;
        }
        #tab_matricula_origem tbody tr td {
            margin: 0 auto;
        }
        div.container {
            width: 80%;
        }
        .form-inline {
            padding-left: 5px;
            padding-right: 5px;
            padding-bottom: 5px;
        }
        .alinha_direita {
            text-align: right;
        }
        th {
            font-size: 12px;
            white-space: nowrap;
        }
        td {
            font-size: 11px;
        }
        .modal-dialog {
            position: relative;
            display: table;
            overflow-y: auto;
            overflow-x: auto;
            width: auto;
            min-width: 400px;
        }
        .form-group {
            margin-bottom: 2px;
        }
        #events {
            margin-bottom: 1em;
            padding: 1em;
            background-color: #f6f6f6;
            border: 1px solid #999;
            border-radius: 3px;
            height: 100px;
            overflow: auto;
        }
        .secao-cartao-card {
            padding: 10px;
            margin-left: 10px;
            margin-right: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .secao-cartao-card + .secao-cartao-card {
            margin-top: 12px;
        }
        .secao-cartao-card strong {
            display: block;
            margin-bottom: 8px;
        }
        .secao-empregador-controles {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding-left: 5px;
            padding-right: 5px;
            padding-bottom: 5px;
        }
        .secao-empregador-campo {
            display: inline-flex;
            align-items: center;
            flex-wrap: nowrap;
            gap: 8px;
            margin-bottom: 0;
        }
        .secao-empregador-campo label {
            margin-bottom: 0;
            font-weight: normal;
            white-space: nowrap;
        }
        .secao-empregador-campo .form-control {
            width: auto;
            min-width: 200px;
        }
        .secao-empregador-acoes {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .secao-empregador-acoes .btn {
            margin: 0;
        }
    </style>
</head>
<body>
<div class="container-wrapper">
    <section class="content-header">
        <h1 style="margin-top: -1px;margin-left: -6px;">
            CARTÕES <small>criar número de cartão</small> </h1>
    </section>
    <section class="content">
        <div class="row">
            <div class="box">
                <div class="box-header">
                    <form id="listagem" name="listagem"  role="form">
                        <div class="secao-cartao-card">
                            <strong>Criar cartão novo individual por associado</strong>
                            <div class="form-inline">
                                <div class="form-group">
                                    <label for="C_tipoarquivo">Tipo arquivo:</label>
                                    <select class="form-control" id="C_tipoarquivo" name="C_tipoarquivo" style="margin-right: 20px;">
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="C_lotes">Lotes:</label>
                                    <select class="form-control" id="C_lotes" name="C_lotes" style="margin-right: 20px;">
                                    </select>
                                </div>
                                <input type="button" name="btnConsultar" id="btnConsultar" class="btn btn-primary" style="margin-right: 20px;" value="Adicionar" />
                                <input type="button" name="gerararquivo" id="gerararquivo" class="btn btn-primary" value="Exportar" style="margin-right: 20px;" />
                                <!-- Botão Gerar Cartões para Todos ocultado -->
                                <input type="button" name="gerarTodosCartoes" id="gerarTodosCartoes" class="btn btn-success" value="Gerar Cartões para Todos" style="display: none;" />
                            </div>
                        </div>
                        <!-- Seção: Gerar Cartões por Empregador -->
                        <div class="secao-cartao-card">
                            <strong>Gerar Cartões por Empregador</strong>
                            <div class="secao-empregador-controles">
                                <div class="secao-empregador-campo">
                                    <label for="C_empregador_cartao">Empregador:</label>
                                    <select class="form-control" id="C_empregador_cartao" name="C_empregador_cartao">
                                        <option value="">Selecione um empregador</option>
                                    </select>
                                </div>
                                <div class="secao-empregador-acoes">
                                    <input type="button" id="btnPreviewCartoes" class="btn btn-default" value="Pré-visualizar" />
                                    <input type="button" id="btnGerarCartoesPorEmpregador" class="btn btn-success" value="Gerar Cartões" disabled />
                                    <input type="button" id="btnRelatorioCartaoSenha" class="btn btn-info" value="Relatório Cartão+Senha" />
                                </div>
                                <span id="preview_sem_cartao" style="font-size: 13px; color: #555;"></span>
                            </div>
                        </div>
                    </form>
                
                <div class="box-body">
                    <table id="tabela_dados" class="table display compact table-striped table-hover dt-responsive" width="100%">
                        <thead>
                            <tr>
                                <td>CARTÃO</td>
                                <td class="noExl">MATRICULA</td>
                                <td class="noExl">EMPREGADOR</td>
                                <td>NOME</td>
                                <td>SENHA</td>
                                <td></td>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td></td>
                                <td class="noExl"></td>
                                <td class="noExl"></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</div>
<!-- Modal Busca Associado -->
<section class="content">
    <div class="row">
        <div class="modal fade" id="ModalBuscaAssociado" name="ModalBuscaAssociado">
            <form data-toggle="validator" role="form" name="frmbusca" id="frmbusca">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="ModalEditaLabel" style="width: 100px;float: left;font-size: x-large;">ASSOCIADO&nbsp<small>Consultando</small></h5>
                            <button type="button" class="btn btn-secondary" data-dismiss="modal" style="float: right;">Fechar</button>
                        </div>
                        <div class="modal-body">
                            <div class="container-fluid">
                                <div class="row">
                                    <div class="col-sx-12">
                                        <table id="tabela_busca_associado" class="display table table-striped table-hover dt-responsive" style="width:100%">
                                            <thead>
                                            <tr>
                                                <th>CODIGO</th>
                                                <th>NOME</th>
                                                <th>EMPREGADOR</th>
                                                <th></th>
                                            </tr>
                                            </thead>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
<script src="../Adm/pages/cartoes/js/arquivos_read_script.js"></script>
</body>
</html>
